    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Avari Links",
      "url": "https://links.avari.dev/",
      "description": "Сервис создания коротких ссылок с защитой контента, аналитикой переходов и генерацией QR-кодов.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Создание коротких ссылок за секунды",
        "Кастомные короткие адреса (slug)",
        "Генерация и скачивание QR-кодов",
        "Асинхронная аналитика кликов и переходов",
        "Защита ссылок с материалами 18+ (NSFW)"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Как создать короткую ссылку в Avari Links?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Вставьте исходный URL в поле на главной странице, при необходимости укажите свой код или название, и нажмите «Создать короткую ссылку»."
          }
        },
        {
          "@type": "Question",
          "name": "Сколько времени хранятся созданные ссылки?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ссылки хранятся бессрочно, пока вы или ваши посетители ими пользуетесь. При отсутствии активности более 100 дней неактивные ссылки автоматически очищаются."
          }
        },
        {
          "@type": "Question",
          "name": "Как получить QR-код для ссылки?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Для любой созданной ссылки доступна кнопка QR-кода. Вы можете сразу отсканировать его или скачать в формате PNG высокой четкости."
          }
        }
      ]
    }
    </script>
