name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Agent Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Harness Metadata & Tests
        run: make check-harness

      - name: Keep Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-check-logs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache-dependency-path: apps/api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Format, Vet, Race Tests and Pure Go Build
        run: make check-api

      - name: Generate Code Coverage Report
        working-directory: apps/api
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/api/coverage.out
          retention-days: 14

      - name: Keep Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-check-logs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7

  frontend:
    name: Frontend (React & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint, Test (Vitest) and Build Bundle
        run: make check-web

      - name: Keep Failure Evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-logs
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 7

  docker-verification:
    name: Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: avari-api:ci-test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: avari-web:ci-test

      - name: Validate Docker Compose Configuration
        run: docker compose -f deployments/docker-compose.yml config

  security-scan:
    name: Security & Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Run govulncheck (Go Security Scanner)
        working-directory: apps/api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  deploy:
    name: Deploy to Server (links.avari.dev)
    needs: [harness, backend, frontend, docker-verification, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Build Go API (Linux amd64)
        working-directory: apps/api
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../../bin
          go build -ldflags="-s -w" -o ../../bin/avari-api-linux-amd64 ./cmd/server/main.go

      - name: Build React Bundle
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy to Server via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '157.22.252.225' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
        if: env.SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          # Prepare deploy package
          TEMP_DIR=$(mktemp -d)
          mkdir -p "${TEMP_DIR}/web"
          cp -r apps/web/dist/* "${TEMP_DIR}/web/"
          cp bin/avari-api-linux-amd64 "${TEMP_DIR}/avari-links"
          cp deployments/systemd/avari-links.service "${TEMP_DIR}/avari-links.service"
          
          SSH_OPTS="-p ${SERVER_PORT} -o StrictHostKeyChecking=no -i /home/runner/.ssh/id_deploy"
          
          tar -czf - -C "${TEMP_DIR}" avari-links avari-links.service web | ssh ${SSH_OPTS} "${SERVER_USER}@${SERVER_HOST}" "
          set -euo pipefail
          REMOTE_TMP=\$(mktemp -d)
          trap 'rm -rf \"\${REMOTE_TMP}\"' EXIT

          tar -xzf - -C \"\${REMOTE_TMP}\"

          mkdir -p /opt/avari-links/data /var/www/avari-links/frontend /etc/systemd/system
          chmod +x \"\${REMOTE_TMP}/avari-links\"
          mv \"\${REMOTE_TMP}/avari-links\" /usr/local/bin/avari-links

          rm -rf /var/www/avari-links/frontend/*
          cp -r \"\${REMOTE_TMP}/web/\"* /var/www/avari-links/frontend/

          cp \"\${REMOTE_TMP}/avari-links.service\" /etc/systemd/system/avari-links.service
          systemctl daemon-reload
          systemctl enable avari-links.service
          systemctl restart avari-links.service

          if ! grep -q 'links.avari.dev' /etc/caddy/Caddyfile; then
              cat << 'CADDY_EOF' >> /etc/caddy/Caddyfile

# Avari Links (URL Shortener & Analytics)
links.avari.dev, http://links.avari.dev {
    handle /api/* {
        reverse_proxy localhost:4820
    }
    handle /s/* {
        reverse_proxy localhost:4820
    }
    handle /healthz {
        reverse_proxy localhost:4820
    }
    handle /swagger/* {
        reverse_proxy localhost:4820
    }
    handle {
        root * /var/www/avari-links/frontend
        try_files {path} /index.html
        file_server
    }
    encode gzip zstd
}
CADDY_EOF
          fi

          caddy reload --config /etc/caddy/Caddyfile
          sleep 2
          systemctl is-active avari-links.service
          curl -s -f http://127.0.0.1:4820/healthz
          "
